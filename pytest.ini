[pytest]
# The desktop app's own tests live in tests/. The backend has its own
# pytest.ini under services/api, and its tests import `app.*` with a
# service-relative pythonpath, so they must be run from that directory:
#
#     python -m pytest tests              (desktop, from repo root)
#     python -m pytest                    (backend, from services/api)
#
# Without this file pytest from the repo root recurses into services/api and
# fails collection with "No module named 'app'".
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
